[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "family-budget-bot"
version = "0.1.0"
description = "Private Telegram family budget bot with receipt extraction and multi-currency accounting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.118,<1",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "matplotlib>=3.10,<4",
  "openai>=1.100,<3",
  "Pillow>=11,<13",
  "pillow-heif>=1,<2",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
